<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Évènements - Art Basel</title>
  <meta name="description" content="Carte des expositions TEMPLON — Octobre 2026">
  <style>
    :root {
      --header-height: 88px;
      --page-bg: #ffffff;
      --text: #111111;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: var(--header-height);
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .brand img {
      display: block;
      width: 125px;
      height: auto;
      max-height: 58px;
      object-fit: contain;
      object-position: left center;
    }
    .title {
      margin-left: 28px;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fullscreen {
      flex: 0 0 auto;
      margin-left: 20px;
      color: #111;
      text-decoration: none;
      font-size: 13px;
      border: 1px solid #111;
      padding: 8px 12px;
      transition: background .15s ease, color .15s ease;
    }
    .fullscreen:hover {
      background: #111;
      color: #fff;
    }
    main {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - var(--header-height));
      min-height: 500px;
      border: 0;
    }
    @media (max-width: 650px) {
      :root { --header-height: 72px; }
      header { padding: 10px 16px; }
      .brand img { width: 105px; max-height: 48px; }
      .title { margin-left: 16px; font-size: 14px; }
      .fullscreen { display: none; }
      iframe { min-height: calc(100vh - var(--header-height)); }
    }
  </style>
</head>
